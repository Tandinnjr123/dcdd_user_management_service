services:
  dcddusermanagementservice:
    image: cms-dcddusermanagementservice:latest
    container_name: cms-dcddusermanagementservice
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    ports:
      - "8097:8097"
    networks:
      - educareNetwork
    healthcheck:
      test: wget -qO- http://localhost:8097/health || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  educareNetwork:
    external: true
